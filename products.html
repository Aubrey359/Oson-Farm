    <section id="products">
        <h2>Products & Services</h2>
        <div id="product-list"></div>
    </section>
    <script src="products.js"></script>
    <script>
        // Render products dynamically, prefer localStorage if available
        document.addEventListener('DOMContentLoaded', function() {
            const productList = document.getElementById('product-list');
            let data = [];
            try {
                const local = localStorage.getItem('productsData');
                if (local) {
                    data = JSON.parse(local);
                } else {
                    data = productsData;
                }
            } catch (e) {
                data = productsData;
            }
            if (Array.isArray(data)) {
                productList.innerHTML = data.map((product, idx) => `
                    <div class="product-item">
                        <img src="${product.image}" alt="${product.alt}">
                        <strong>${product.name}</strong>
                        <p>${product.description}</p>
                        <button onclick="orderProduct('${product.name.replace(/'/g, "\\'")}')">Order</button>
                    </div>
                `).join('');
            }
        });
        function orderProduct(productName) {
            alert('Order attempted for: ' + productName + '\nA notification has been sent to the site owner.');
        }
    </script>
