    <section id="order">
        <h2>Order/Booking</h2>
        <form>
            <label for="product">Select Product/Service:</label>
            <select id="product" name="product">
                <option value="coffee">Coffee Seedlings</option>
                <option value="avocado">Avocado Fruits</option>
                <option value="pineapple">Pineapples</option>
                <option value="hay">Hay</option>
                <option value="silage">Silage</option>
                <option value="fish">Fish</option>
                <option value="chicken">Chicken (Live)</option>
                <option value="chicken_slaughtered">Chicken (Slaughtered)</option>
                <option value="milk">Cow Milk</option>
                <option value="bnb">Rental House/BnB</option>
                <option value="car_delivery">Car for Delivery</option>
            </select><br><br>
            <label for="quantity">Quantity/Details:</label>
            <input type="text" id="quantity" name="quantity"><br><br>
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name"><br><br>
            <label for="contact">Contact Info:</label>
            <input type="text" id="contact" name="contact"><br><br>
            <button type="submit">Submit Order/Booking</button>
        </form>
    </section>
